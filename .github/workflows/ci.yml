name: macOS CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild \
            -project VoiceConvert.xcodeproj \
            -scheme VoiceConvert \
            -configuration Debug \
            -sdk macosx \
            -arch arm64 \
            build CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: |
          xcodebuild \
            -project VoiceConvert.xcodeproj \
            -scheme VoiceConvert \
            -configuration Debug \
            -sdk macosx \
            -arch arm64 \
            test CODE_SIGNING_ALLOWED=NO
